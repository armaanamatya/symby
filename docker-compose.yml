# SymbyAI Docker Compose Configuration
# DGX Spark Frontier Hackathon - Symby AI Track
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up streamlit       # Start only Streamlit
#   docker-compose up api             # Start only API
#   docker-compose logs -f            # View logs
#   docker-compose down               # Stop all services

version: '3.8'

services:
  # =============================================================
  # Streamlit Dashboard
  # =============================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: symbyai:latest
    container_name: symbyai-streamlit
    ports:
      - "8501:8501"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - S2_API_KEY=${S2_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATA_PATH=/app/s2orc_data
      - DEFAULT_PAPERS=${DEFAULT_PAPERS:-50000}
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./s2orc_data:/app/s2orc_data:ro
      - ./cache:/app/cache
      - ./checkpoints:/app/checkpoints
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - symbyai-network

  # =============================================================
  # FastAPI Backend
  # =============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: symbyai:latest
    container_name: symbyai-api
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - S2_API_KEY=${S2_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATA_PATH=/app/s2orc_data
      - DEFAULT_PAPERS=${DEFAULT_PAPERS:-50000}
    volumes:
      - ./s2orc_data:/app/s2orc_data:ro
      - ./cache:/app/cache
      - ./checkpoints:/app/checkpoints
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - symbyai-network

  # =============================================================
  # Combined Service (Streamlit + API via supervisor)
  # =============================================================
  combined:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: symbyai:latest
    container_name: symbyai-combined
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - S2_API_KEY=${S2_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATA_PATH=/app/s2orc_data
      - DEFAULT_PAPERS=${DEFAULT_PAPERS:-50000}
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./s2orc_data:/app/s2orc_data:ro
      - ./cache:/app/cache
      - ./checkpoints:/app/checkpoints
    command: >
      sh -c "uvicorn api:app --host 0.0.0.0 --port 8000 &
             streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    restart: unless-stopped
    networks:
      - symbyai-network
    profiles:
      - combined

networks:
  symbyai-network:
    driver: bridge

volumes:
  cache:
  checkpoints:
